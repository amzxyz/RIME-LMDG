name: Auto Build Wanxiang Tools

on:
  push:
    branches: 
      - wanxiang
    paths:
      - 'pypinyin/**'
      - 'wanxiang-tools.py'
      - 'wanxiang-updater/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # =================================================
  # 1. Linux 构建 (Debian + 图标 + 依赖增强)
  # =================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - run: sudo apt-get update && sudo apt-get install -y binutils imagemagick

      - run: |
          python -m venv venv
          source venv/bin/activate
          pip install PySide6 requests pyinstaller ruamel.yaml
          
          if [ ! -f icon.ico ]; then touch icon.ico; fi
          # 转换图标
          convert icon.ico -resize 256x256 wanxiang-tools.png
          
          pyinstaller -F -w \
            --clean \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin:pypinyin" \
            --hidden-import requests \
            --collect-all ruamel.yaml \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module libsystemd \
            --exclude-module PIL \
            --exclude-module cv2 \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            --exclude-module PySide6.Qt3DCore \
            -i icon.ico \
            wanxiang-tools.py

          strip dist/wanxiang-tools

      # --- 制作 .deb 包 ---
      - run: |
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p dist/deb/usr/local/bin
          mkdir -p dist/deb/usr/share/pixmaps
          mkdir -p dist/deb/usr/share/applications
          mkdir -p dist/deb/DEBIAN

          cp dist/wanxiang-tools dist/deb/usr/local/bin/
          cp wanxiang-tools.png dist/deb/usr/share/pixmaps/

          cat > dist/deb/usr/share/applications/wanxiang-tools.desktop <<EOF
          [Desktop Entry]
          Name=Wanxiang Tools
          Name[zh_CN]=万象词库工具
          Comment=万象词库方案更新工具
          Exec=/usr/local/bin/wanxiang-tools
          Icon=wanxiang-tools
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupWMClass=wanxiang-tools
          EOF

          chmod 755 dist/wanxiang-tools dist/deb/DEBIAN
          
          cat > dist/deb/DEBIAN/control <<EOF
          Package: wanxiang-tools
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgcc1, libgl1, libxkbcommon-x11-0, libegl1
          Maintainer: Wanxiang <user@example.com>
          Description: 万象词库-刷拼音-辅助码工具
           支持rime用户词库与固定词库格式，用于帮助维护自己的挂接词库与非万象词库生成的用户词库迁移到万象。
          EOF
          
          dpkg-deb --build dist/deb dist/wanxiang-tools_linux_amd64.deb

      - name: Prepare Artifacts
        run: |
          mkdir -p upload_stage
          cp dist/wanxiang-tools upload_stage/
          cp dist/*.deb upload_stage/
          cp wanxiang-tools.png upload_stage/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-dist
          path: upload_stage/*

  # =================================================
  # 2. Arch Linux 构建
  # =================================================
  package-arch:
    needs: build-linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: build_dir

      - name: Build Arch Package
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm libglvnd libxcb libxkbcommon fontconfig git

          cd build_dir
          chmod +x wanxiang-tools
          
          cat > wanxiang-tools.desktop <<EOF
          [Desktop Entry]
          Name=Wanxiang Tools
          Name[zh_CN]=万象词库工具
          Comment=万象词库方案更新工具
          Exec=/usr/bin/wanxiang-tools
          Icon=wanxiang-tools
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupWMClass=wanxiang-tools
          EOF
          
          cp wanxiang-tools.png wanxiang-tools.png.bk

          VERSION="1.0.${{ github.run_number }}"
          
          cat > PKGBUILD <<EOF
          pkgname=wanxiang-tools
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="万象词库方案更新工具 (Auto Build)"
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('GPL')
          depends=('glibc' 'libglvnd' 'libxcb' 'libxkbcommon' 'fontconfig')
          source=("wanxiang-tools" "wanxiang-tools.png" "wanxiang-tools.desktop")
          sha256sums=('SKIP' 'SKIP' 'SKIP')
          
          options=('!debug' '!strip') 

          package() {
              install -Dm755 "\$srcdir/wanxiang-tools" "\$pkgdir/usr/bin/wanxiang-tools"
              install -Dm644 "\$srcdir/wanxiang-tools.png" "\$pkgdir/usr/share/pixmaps/wanxiang-tools.png"
              install -Dm644 "\$srcdir/wanxiang-tools.desktop" "\$pkgdir/usr/share/applications/wanxiang-tools.desktop"
          }
          EOF

          useradd builder -m
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"
          mv *.pkg.tar.zst ../

      - name: Upload Arch Package
        uses: actions/upload-artifact@v5
        with:
          name: arch-pkg
          path: ./*.pkg.tar.zst

  # =================================================
  # 3. Windows 构建
  # =================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Build with PyInstaller
        shell: bash
        run: |
          pip install PySide6 requests pyinstaller ruamel.yaml
          if [ ! -f icon.ico ]; then touch icon.ico; fi

          pyinstaller -F -w \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin;pypinyin" \
            --hidden-import requests \
            --collect-all ruamel.yaml \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            -i icon.ico \
            wanxiang-tools.py

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-dist
          path: dist/*.exe

  # =================================================
  # 4. macOS 构建
  # =================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install PySide6 requests pyinstaller pillow ruamel.yaml
      - run: |
          if [ ! -f icon.ico ]; then touch icon.ico; fi

          pyinstaller -F -w \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin:pypinyin" \
            --hidden-import requests \
            --collect-all ruamel.yaml \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            -i icon.ico \
            wanxiang-tools.py
          
          cd dist
          zip -r wanxiang-tools-macos.zip wanxiang-tools.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-dist
          path: dist/*.zip

  # =================================================
  # 5. Android APK 构建 (Kotlin + Compose)
  # =================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout 代码
        uses: actions/checkout@v5

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 设置官方 Gradle 环境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔐 解码签名文件
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > wanxiang-updater/app/release.jks

      - name: 🔨 编译 Release 正式版 APK
        working-directory: ./wanxiang-updater
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: wanxiang-updater/app/build/outputs/apk/release/app-release.apk

  # =================================================
  # 6. 统一发布到 GitHub Release (覆盖 tool 标签)
  # =================================================
  publish:
    needs: [build-linux, package-arch, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract Version
        run: |
          EXTRACTED_VER=$(grep -E "^TOOL_VERSION\s*=" wanxiang-tools.py | awk -F'['\''"]' '{print $2}')
          echo "从源码中提取到版本号: $EXTRACTED_VER"
          echo "TOOL_VER=$EXTRACTED_VER" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Clean up and Rename Artifacts
        run: |
          cd release_files
          rm -f *.png
          rm -f *-debug-*.pkg.tar.zst
          # 给安卓包重命名，看起来更专业
          mv app-release.apk Wanxiang-Updater-Android.apk || true
          ls -R

      - name: Delete old Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete tool --cleanup-tag --yes || true
          git push origin --delete tool || true
          sleep 5

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: tool
          target_commitish: ${{ github.sha }}
          name: "万象词库-刷拼音-辅助码工具 - ${{ env.TOOL_VER }}"
          body: |
            ## 💻 桌面端工具功能
            - 支持 rime 用户词库与固定词库格式，用于帮助维护自己的挂接词库与非万象词库生成的用户词库迁移到万象。
            - 公共拼音标注工具 (pypinyin GUI简版)。
            - 支持更新万象各方案、词库、模型，在线更新方案 GUI。

            ## 📱 安卓移动端 (万象更新 App)
            - 断点续传、纯原生 Kotlin + Compose 极简编译。
            - 一键下载并部署全量更新、方案、词库、模型至同文/Fcitx5目录。

            ## 📦 Linux 安装说明
            - **Debian/Ubuntu**: 下载 `.deb` 包，运行 `sudo dpkg -i wanxiang-tools*.deb`
            - **Arch Linux/Manjaro**:  下载 `.pkg.tar.zst` 包，运行:
              `sudo pacman -U wanxiang-tools-*.pkg.tar.zst`

            ## 🍎 macOS 用户注意
            如果提示“文件损坏”：
            `sudo xattr -rd com.apple.quarantine /path/to/wanxiang-tools-macos`
          files: release_files/*